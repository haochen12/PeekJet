name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build portable executable
        shell: powershell
        run: .\build.ps1
      - name: Check theme rendering and contrast
        shell: powershell
        run: |
          $check = Start-Process .\dist\PeekJet.exe -ArgumentList '--self-test-themes' -Wait -PassThru
          Get-Content .\dist\theme-test.log
          if ($check.ExitCode -ne 0) { throw 'Theme checks failed.' }
      - name: Package portable and source archives
        shell: powershell
        run: .\package.ps1 -SkipBuild
      - uses: actions/upload-artifact@v7
        with:
          name: PeekJet-windows
          path: |
            PeekJet-v*-windows.zip
            PeekJet-v*-source.zip
          if-no-files-found: error
